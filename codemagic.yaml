workflows:
  android-apk:
    name: Reminder Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 17
    scripts:
        - name: Install compatible Gradle
          script: |
            curl -L https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp
        - name: Build installable debug APK
          script: |
            /tmp/gradle-8.9/bin/gradle assembleDebug
          gradle --version
          gradle assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
